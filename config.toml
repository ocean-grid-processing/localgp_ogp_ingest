# Static constants + paths for ohc_ingest (one per product/environment).
# The per-run LAYER is on the command line and is required:
#   ohc_ingest config.toml --tag OP20260110 --layer 15-20
# (one run processes exactly one layer; loop layers via your job scheduler.)
# The time axis is autodetected from the mapping files (whole calendar years; gaps are fatal).
# The run identifier comes from --tag / OHC_TAG.

var_name   = "potentialTemperature"
model_name = "SpaceTimeTrend"

latitude_range_to_keep = [-64.5, 64.5]
basins_to_remove       = [0, 5, 6, 7, 8, 9, 53]
bathy_clip_m = 300

