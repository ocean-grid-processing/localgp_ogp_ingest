var_name   = "mld"
model_name = "SpaceTimeTrend"

latitude_range_to_keep = [-64.5, 64.5]
basins_to_remove       = [0, 5, 6, 7, 8, 9, 53]
bathy_clip_m = 300

etopo_path     = "/scratch/alpine/wimi7695/ohc_prod/params/etopo60.cdf"
basinmask_path = "/scratch/alpine/wimi7695/ohc_prod/params/basinmask_04.msk"

# The mapped quantity and its scaling. Every raw mapping value is multiplied by the product of
# `scale_terms` at ingest; the names are kept in the provenance so the physics stays legible.
# Omit the whole table for the OHC defaults shown here; an empty `scale_terms = {}` stores the
# mapping values as they are (e.g. a mixed layer depth: name = "mld", kind = "intensive",
# units = "m", publish_unit_factor = 1.0, publish_units = "m").
[quantity]
name          = "mld"
kind          = "intensive"        # extensive (per-area density) | intensive (per-cell value)
units         = "dbar"             # units of the stored, scaled field
long_name     = "mixed layer depth"
scale_terms   = { }  
publish_unit_factor = 1         # one published unit = this many stored units (1 TJ/m2 = 1e12 J/m2)
publish_units = "dbar"
